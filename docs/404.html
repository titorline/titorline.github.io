      // Theme switch wiring — shared by every `.theme-toggle` on the page.
      // Two states only: Light <-> Dark. First visit (no stored choice) follows
      // the OS via prefers-color-scheme; the first click pins an explicit theme.
      const KEY = 'theme';
      const root = document.documentElement;

      // The active theme: an explicit stored choice, else the OS preference
      // resolved to light/dark (matches the unset `prefers-color-scheme` CSS).
      const effective = () => {
        try {
          const stored = localStorage.getItem(KEY);
          if (stored === 'light' || stored === 'dark') return stored;
        } catch {}
        return window.matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark'
          : 'light';
      };

      const sync = (btn: HTMLElement, theme: string) => {
        btn.dataset.pref = theme;
        const label = btn.dataset.label || 'Theme';
        const name = btn.dataset[theme] || theme;
        btn.setAttribute('aria-label', `${label}: ${name}`);
        btn.setAttribute('title', `${label}: ${name}`);
      };

      const apply = (theme: string) => {
        root.setAttribute('data-theme', theme);
        try {
          localStorage.setItem(KEY, theme);
        } catch {}
        document
          .querySelectorAll<HTMLElement>('.theme-toggle')
          .forEach((btn) => sync(btn, theme));
      };

      document.querySelectorAll<HTMLElement>('.theme-toggle').forEach((btn) => {
        sync(btn, effective());
